[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlxtuner"
dynamic = ["version"]
description = "Fine-tune LLMs on Apple Silicon with one command. Memory-aware defaults for 8 GB Macs and up, built on MLX."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "mlxtuner contributors" }]
keywords = ["mlx", "apple-silicon", "fine-tuning", "lora", "llm", "mac"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mlx-lm>=0.20,<1.0",
    "typer>=0.12",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "rich>=13.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Load datasets straight from the Hugging Face Hub by id.
hub = ["datasets>=2.20"]
# Extras llama.cpp's convert_hf_to_gguf.py needs beyond what mlx-lm already pulls in.
gguf = ["torch>=2.1", "sentencepiece>=0.1.98,<0.3", "protobuf>=4.21,<8"]
dev = ["pytest>=8", "ruff>=0.6", "tomli>=2; python_version<'3.11'"]

[project.scripts]
mlxtuner = "mlxtuner.cli:app"

[project.urls]
Homepage = "https://github.com/Dolmaa24/mlxtuner"
Issues = "https://github.com/Dolmaa24/mlxtuner/issues"

[tool.hatch.version]
# Single source of truth: the package's __version__.
path = "src/mlxtuner/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mlxtuner"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: downloads a small model and trains a few steps on the local Mac",
]
